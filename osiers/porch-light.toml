# Sample osiermap. `npm run check` reads this and lists it.
# Binds stay commented out, so the count is zero.
#
# label — name in the list
# door — where the walk would start (empty is fine while I'm sketching)
# binds — open (at), scribe (at, words), nudge (at), sight (at, line)
# whisper.to — $ENV holding a Discord or Slack incoming webhook. Empty stays quiet.
# to = "$OSIER_WHISPER_HOOK"
#
# [[binds]]
# act = "open"
# at = "https://example.com/login"
#
# [[binds]]
# act = "scribe"
# at = "input[name=email]"
# words = "user@example.com"
#
# [[binds]]
# act = "scribe"
# at = "input[name=password]"
# words = "${PASSWORD}"
#
# [[binds]]
# act = "nudge"
# at = "button[type=submit]"
#
# [[binds]]
# act = "sight"
# at = "**/home"
# line = "Signed in"

label = "porch-light"
door = ""
binds = []

[whisper]
to = ""
