# Live demo. No login. `npm run walk` opens example.com and looks for the heading.
#
# door — opened once before the binds
# open — go to `at`
# sight — `at` is a URL glob, then the page must show `line`
# whisper.to — empty, so a failure stays on this machine.
# Set it to "$OSIER_WHISPER_HOOK" when that repo secret should hear about it.

label = "porch-light"
door = "https://example.com"

[[binds]]
act = "open"
at = "https://example.com"

[[binds]]
act = "sight"
at = "https://example.com/**"
line = "This domain is for use in documentation examples without needing permission."

[whisper]
to = ""
